{{- if and .Values.sso.enabled (not .Values.sso.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feedbox.ssoSecretName" . }}
  labels:
    {{- include "feedbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.sso.encryptionSecretKey }}: {{ .Values.sso.encryptionSecret | required "sso.encryptionSecret is required when sso.existingSecret is empty" | quote }}
  {{- if .Values.sso.clientSecret }}
  {{ .Values.sso.clientSecretKey }}: {{ .Values.sso.clientSecret | quote }}
  {{- end }}
{{- end }}
