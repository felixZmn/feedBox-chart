replicaCount: 1

image:
  repository: ghcr.io/felixzmn/docker
  name: feedbox
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: regcred

# When TLS terminates at ingress/Gateway, Quarkus only sees http://:8080 and OIDC
# builds redirect_uri as http://…. Set true only if the proxy sends X-Forwarded-Proto
# (and typically X-Forwarded-Host). Leave false for plain-HTTP or direct TLS to the pod.
proxy:
  forwardHeaders: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  automount: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"

startupProbe:
  httpGet:
    path: /q/health/ready
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /q/health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Application ConfigMap data (UA defaults to FeedBox/${quarkus.application.version} in the app)
config:
  quarkus.http.host: "0.0.0.0"
  quarkus.http.port: "8080"

# Extend environment variables easily
extraEnv: []
# - name: MY_CUSTOM_VAR
#   value: "custom"
# - name: MY_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: my-key

# Extend envFrom sources
extraEnvFrom: []
# - configMapRef:
#     name: extra-configmap
# - secretRef:
#     name: extra-secret

sso:
  enabled: true
  # IdP issuer / OIDC discovery URL (e.g. https://idp.example/application/o/app/).
  authServerUrl: ""
  clientId: ""
  # Login-panel button text (e.g. "Sign in with Authentik"). Ready for multi-IdP later.
  buttonLabel: "Sign in with SSO"
  # Prefer an existing Secret; when set, encryptionSecret/clientSecret values are ignored.
  existingSecret: ""
  encryptionSecretKey: encryption-secret
  clientSecretKey: client-secret
  # Used only when existingSecret is empty — written into a chart-managed Secret (not Deployment env).
  # Optional — set for confidential clients; omit for public + PKCE.
  clientSecret: ""
  # Required when existingSecret is empty — 32+ chars; encrypts the OIDC session cookie.
  encryptionSecret: ""

database:
  # Required at deploy time — name of a Secret holding the JDBC URL (see jdbcUrlKey).
  dbSecretName: ""
  jdbcUrlKey: jdbc-uri

# NOTE: Only enable ONE of ingress or httpRoute. Kubernetes does not enforce mutual exclusivity.
# Both default off; enable the one that matches your cluster.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # Example when enabling:
  # hosts:
  #   - host: feedbox.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # Example when enabling:
  # parentRefs:
  #   - name: gateway
  #     sectionName: http
  #     namespace: default
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

nodeSelector: {}
tolerations: []
affinity: {}