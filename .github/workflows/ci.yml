name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm lint
        run: helm lint .

      - name: Read chart name
        id: chart
        shell: bash
        run: |
          name="$(helm show chart . | awk '/^name:/ {print $2}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Helm template
        run: >
          helm template "${{ steps.chart.outputs.name }}" .
          --set database.dbSecretName=ci-db-secret
          --set sso.clientId=ci-client
          --set sso.authServerUrl=https://idp.example/application/o/ci/
          --set sso.encryptionSecret=ci-encryption-secret-at-least-32b
          > /dev/null
